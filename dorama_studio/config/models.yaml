# Model Selection Rules
model_selection_rules:
  # Narrative tasks use proven models by default
  narrative:
    default_model: claude-opus-4-5
    fallback_strategy: proven_first
    budget_allocation:
      proven: 0.7
      exploration: 0.2
      big_bet: 0.1

  # Analytical tasks can use exploration models
  analytical:
    default_model: deepseek-r1
    fallback_strategy: balanced
    budget_allocation:
      proven: 0.5
      exploration: 0.3
      big_bet: 0.2

  # Creative tasks can use big bet models
  creative:
    default_model: claude-haiku-4-5
    fallback_strategy: creative_first
    budget_allocation:
      proven: 0.4
      exploration: 0.4
      big_bet: 0.2

  # Video generation uses proven models for quality
  video_generation:
    default_model: veo-3-1-standard
    fallback_strategy: quality_first
    budget_allocation:
      proven: 0.8
      exploration: 0.15
      big_bet: 0.05

  # Image generation balances quality and cost
  image_generation:
    default_model: flux-pro
    fallback_strategy: balanced
    budget_allocation:
      proven: 0.6
      exploration: 0.25
      big_bet: 0.15

  # Audio generation prioritizes quality for voice
  audio_generation:
    default_model: elevenlabs-premium
    fallback_strategy: quality_first
    budget_allocation:
      proven: 0.7
      exploration: 0.2
      big_bet: 0.1

# Global Settings
global_settings:
  default_timeout_sec: 30
  max_retries: 3
  retry_delay_sec: 1
  enable_fallback_chain: true
  enable_cost_tracking: true
  enable_performance_tracking: true
  temperature: 0.7
  top_p: 0.9
  frequency_penalty: 0.0
  presence_penalty: 0.0